<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Locator and Healer</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <main>
      <header style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Locator Studio</h1>
      </header>

      <div class="tabs">
        <button id="tab-finder" class="tab-btn active">🎯 Finder</button>
        <button id="tab-recorder" class="tab-btn">⏺ Recorder</button>
      </div>

      <!-- ================= FINDER VIEW ================= -->
      <div id="view-finder">
        <button id="pick-btn" class="primary-btn">🎯 Pick Element</button>
        <section id="results-section" style="display: none; margin-top: 16px;">
          <h2>Locators</h2>
          <div id="locator-list" class="card-list"></div>
        </section>
      </div>

      <!-- ================= RECORDER VIEW ================= -->
      <div id="view-recorder" style="display: none;">
        
        <!-- Top Row: Start/Stop & Switch Tab -->
        <div class="button-row">
          <button id="record-btn" class="primary-btn">⏺ Start Recording</button>
          <button id="switch-tab-btn" class="secondary-btn" title="Track actions in a newly opened tab">➕ Tab</button>
        </div>
        
        <label class="assert-toggle-label">
          <input type="checkbox" id="assert-toggle" />
          Assertion Mode (Click element to assert)
        </label>

        <!-- File Toolbar: Dropdown & Features Gear -->
        <div class="file-toolbar">
          <select id="file-selector" class="file-dropdown">
            <option value="raw_test">Raw Test (.js)</option>
            <option value="faker_data">Faker Data (.js)</option>
            <option value="auth_setup">Auth Setup (.js)</option>
            <option value="pom_test">POM Test (.js)</option>
            <option value="page_object">Page Object (.js)</option>
          </select>

          <div style="position: relative;">
            <button id="features-btn" class="icon-btn" title="Advanced Features">⚙️</button>
            <!-- Dropdown Menu -->
            <div id="features-menu" class="dropdown-menu" style="display: none;">
              <label class="dropdown-item">
                <input type="checkbox" id="toggle-faker" /> Add Faker.js Data
              </label>
              <label class="dropdown-item">
                <input type="checkbox" id="toggle-tags" /> Add @smoke Tag
              </label>
              <label class="dropdown-item">
                <input type="checkbox" id="toggle-auth" /> Add Auth StorageState
              </label>
            </div>
          </div>
        </div>

        <!-- Code Box -->
        <div class="code-box-container">
          <textarea id="main-code-box" readonly spellcheck="false" placeholder="Start recording to generate code..."></textarea>
          <button id="copy-main-btn" class="export-btn">Copy Code</button>
        </div>

      </div>

    </main>

    <!-- ASSERTION MODAL -->
    <div id="assertion-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <h3>What do you want to assert?</h3>
        <div class="modal-buttons">
          <button id="assert-visible-btn" class="assert-choice-btn">Is Visible</button>
          <button id="assert-enabled-btn" class="assert-choice-btn">Is Enabled</button>
          <button id="assert-text-btn" class="assert-choice-btn">Has Text</button>
          <button id="assert-value-btn" class="assert-choice-btn">Has Value</button>
        </div>
        <button id="assert-cancel-btn" style="margin-top: 12px; background: transparent; border: none; color: #888; cursor: pointer; width: 100%;">Cancel</button>
      </div>
    </div>

    <script type="module" src="./panel.js"></script>
  </body>
</html>
